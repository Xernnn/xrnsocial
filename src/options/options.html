<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BlockDistractXrn — Back up &amp; restore</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <header class="head">
      <span class="logo">B</span>
      <div>
        <h1>Back up &amp; restore</h1>
        <p class="dim">Right now: <span id="current">loading…</span></p>
      </div>
    </header>

    <section class="card">
      <h2>Back up</h2>
      <p class="dim">Saves all your settings to a file on this computer.</p>
      <button id="export" class="primary">Download backup</button>
    </section>

    <section class="card">
      <h2>Restore</h2>
      <p class="dim">Loads a backup file. It replaces your current settings.</p>
      <input type="file" id="file" accept=".json,application/json" />
      <p id="preview" class="dim"></p>
      <button id="restore" class="primary" disabled>Restore this backup</button>
      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="../common/sites.js"></script>
  <script src="../sites/facebook.js"></script>
  <script src="../sites/reddit.js"></script>
  <script src="../sites/x.js"></script>
  <script src="../sites/linkedin.js"></script>
  <script src="../sites/instagram.js"></script>
  <script src="../sites/twitch.js"></script>
  <script src="../sites/tiktok.js"></script>
  <script src="../common/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
