<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="logo">B</span>
    <div class="brand">
      <strong>xrnsocial</strong>
      <span class="sub" id="status">loading…</span>
    </div>
    <label class="switch big" title="Turn every rule on every site on or off">
      <input type="checkbox" id="master" />
      <span class="track"></span>
    </label>
  </header>

  <button class="pick" id="pick" title="Point at anything on the page and click to hide it">
    <span class="pick-icon">⌖</span>
    <b>Pick something to hide</b>
    <kbd id="pickKey">Alt+Shift+H</kbd>
  </button>

  <nav class="sites" id="sites" aria-label="Site"></nav>

  <nav class="tabs">
    <button class="tab is-on" data-tab="presets">Blocks</button>
    <button class="tab" data-tab="custom">Picked <span class="pill" id="customCount">0</span></button>
    <button class="tab" data-tab="words">Words</button>
  </nav>

  <section class="panel is-on" data-panel="presets">
    <div class="row master-row" id="siteRow">
      <div class="row-text"><b id="siteLabel">Use on this site</b></div>
      <label class="switch">
        <input type="checkbox" id="siteEnabled" />
        <span class="track"></span>
      </label>
    </div>
    <input type="search" id="filter" class="filter" placeholder="Search" />
    <div id="presets"></div>
  </section>

  <section class="panel" data-panel="custom">
    <div id="custom"></div>
  </section>

  <section class="panel" data-panel="words">
    <div class="row master-row">
      <div class="row-text"><b>Hide posts with these words</b></div>
      <label class="switch">
        <input type="checkbox" id="kwEnabled" />
        <span class="track"></span>
      </label>
    </div>
    <textarea id="kwTerms" spellcheck="false" placeholder="One per line, e.g.&#10;politics&#10;giveaway"></textarea>
    <p class="note"><span>All sites · /regex/ works</span><span id="kwCount"></span></p>

    <div class="row" id="phRow" title="Hidden posts leave a thin bar you can click to show them. Ads never do.">
      <div class="row-text"><b>Leave a "show" bar</b></div>
      <label class="switch">
        <input type="checkbox" id="placeholders" />
        <span class="track"></span>
      </label>
    </div>
  </section>

  <footer class="foot">
    <span>
      <button id="backup" class="link">Back up</button>
      <span class="dot">·</span>
      <button id="reset" class="link danger">Reset</button>
    </span>
    <span id="hidden" class="muted"></span>
  </footer>

  <script src="../common/sites.js"></script>
  <script src="../sites/facebook.js"></script>
  <script src="../sites/reddit.js"></script>
  <script src="../sites/x.js"></script>
  <script src="../sites/linkedin.js"></script>
  <script src="../sites/instagram.js"></script>
  <script src="../sites/twitch.js"></script>
  <script src="../sites/tiktok.js"></script>
  <script src="../common/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
