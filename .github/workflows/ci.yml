name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The oldest Node package.json's engines promises (>=22.12).
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke tests (jsdom)
        run: npm test

      # The runner's own Chrome is branded Chrome, which ignores unpacked
      # extensions, so both browsers come from the README's commands. Chrome is
      # then named with CHROME_PATH: @puppeteer/browsers 3 installs it under
      # chrome/linux-<version>/, and test/browser.js only looks in linux64-*.
      - name: Chrome for Testing and Firefox
        run: |
          chrome=$(npx @puppeteer/browsers install chrome@stable --path ~/.cache/puppeteer --format '{{path}}')
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          npx @puppeteer/browsers install firefox@stable --path ~/.cache/bfx-firefox

      - name: Browser tests (Chrome)
        run: npm run test:browser

      - name: Browser tests (Firefox)
        run: npm run test:firefox
